name: Build NNUE1SKHY pbrain

on:
  push:
    branches:
      - nnue1skhy-v0.3.1-pbrain
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: pwsh
        run: |
          $parts = @(
            "pbrain_min_payload/source_00.b64",
            "pbrain_min_payload/source_01.b64",
            "pbrain_min_payload/source_02a.b64",
            "pbrain_min_payload/source_02b.b64",
            "pbrain_min_payload/source_02c.b64",
            "pbrain_min_payload/source_02d.b64",
            "pbrain_min_payload/source_03.b64",
            "pbrain_min_payload/source_04.b64",
            "pbrain_min_payload/source_05.b64",
            "pbrain_min_payload/source_06.b64",
            "pbrain_min_payload/source_07.b64",
            "pbrain_min_payload/source_08.b64"
          )
          foreach ($p in $parts) {
            if (!(Test-Path $p)) { throw "Missing payload: $p" }
          }
          $b64 = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ""
          if ($b64.Length -ne 65072) { throw "Bad base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes("pbrain_min.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "pbrain_min.zip" -Algorithm SHA256).Hash.ToLower()
          Write-Host "Payload SHA256: $hash"
          if ($hash -ne "c5f8610ad1226a8d6005fc7caaf2f32bfbc8b9986c536a6dd81e16bbfead0f1d") {
            throw "Bad payload SHA256: $hash"
          }
          Expand-Archive -Path "pbrain_min.zip" -DestinationPath "." -Force

      - name: Write minimal CMake project
        shell: pwsh
        run: |
          @'
          cmake_minimum_required(VERSION 3.20)
          project(NNUE1SKHY VERSION 0.3.1 LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)

          add_library(nnue1skhy_core
              src/core/position.cpp
              src/core/config.cpp
              src/rules/renju.cpp
              src/search/eval.cpp
              src/search/tt.cpp
              src/search/search.cpp
              src/search/threat_solver.cpp
              src/nnue/nnue.cpp
              src/nnue/nnue_avx2.cpp
              src/nnue/nnue_cuda_stub.cpp
              src/hardware/hardware.cpp
          )
          target_include_directories(nnue1skhy_core PUBLIC src)
          target_compile_definitions(nnue1skhy_core PRIVATE NNUE1SKHY_AVX2_KERNEL=1)
          set_source_files_properties(src/nnue/nnue_avx2.cpp PROPERTIES COMPILE_OPTIONS "/arch:AVX2")
          if(MSVC)
              target_compile_options(nnue1skhy_core PRIVATE /O2 /W4 /permissive-)
          endif()

          add_executable(NNUE1SKHY
              src/main.cpp
              src/protocol/piskvork.cpp
          )
          target_link_libraries(NNUE1SKHY PRIVATE nnue1skhy_core)
          '@ | Set-Content -Encoding ascii "pbrain_min/CMakeLists.txt"

      - name: Configure MSVC x64
        run: cmake -S pbrain_min -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --target NNUE1SKHY --parallel 2

      - name: Piskvork protocol smoke test
        shell: pwsh
        run: |
          $input = "START 15`nABOUT`nEND`n"
          $input | & ".\build\Release\NNUE1SKHY.exe" | Tee-Object -FilePath protocol-smoke.txt
          $out = Get-Content protocol-smoke.txt -Raw
          if ($out -notmatch "OK") { throw "START 15 did not return OK" }
          if ($out -notmatch "NNUE1SKHY") { throw "ABOUT did not identify NNUE1SKHY" }

      - name: Package pbrain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force dist/config | Out-Null
          Copy-Item ".\build\Release\NNUE1SKHY.exe" ".\dist\pbrain-NNUE1SKHY_renju-15.exe"
          Copy-Item ".\pbrain_min\config\NNUE1SKHY.toml" ".\dist\config\NNUE1SKHY.toml"
          @'
          NNUE1SKHY v0.3.1 Performance
          Piskvork/Gomocup compatible pbrain executable.
          Board: 15x15
          Rule: Renju (INFO rule 4)
          Main file: pbrain-NNUE1SKHY_renju-15.exe
          '@ | Set-Content -Encoding ascii ".\dist\README.txt"

      - name: Upload Win64 pbrain artifact
        uses: actions/upload-artifact@v4
        with:
          name: NNUE1SKHY-v0.3.1-pbrain-win64
          path: dist/
          if-no-files-found: error
