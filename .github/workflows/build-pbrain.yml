name: Build NNUE1SKHY pbrain Win64

on:
  workflow_dispatch:
  push:
    branches:
      - nnue1skhy-v0.3.1-pbrain
    paths:
      - "pbrain_min_payload/**"
      - ".github/workflows/build-pbrain.yml"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: pwsh
        run: |
          $parts = 0..8 | ForEach-Object { "pbrain_min_payload/source_{0:D2}.b64" -f $_ }
          foreach ($p in $parts) {
            if (!(Test-Path $p)) { throw "Missing payload chunk: $p" }
          }
          $b64 = ""
          foreach ($p in $parts) { $b64 += (Get-Content $p -Raw).Trim() }
          if ($b64.Length -ne 64408) { throw "Unexpected base64 length: $($b64.Length)" }
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("$pwd\pbrain_min.zip", $bytes)
          $hash = (Get-FileHash "$pwd\pbrain_min.zip" -Algorithm SHA256).Hash.ToLower()
          Write-Host "Reconstructed payload SHA256: $hash"
          Expand-Archive "$pwd\pbrain_min.zip" -DestinationPath "$pwd\srcpkg" -Force
          $main = Get-Content "srcpkg/pbrain_min/src/main.cpp" -Raw
          if ($main -notmatch "GetModuleFileNameW") { throw "EXE-relative path fix missing from source payload" }
          if ($main -notmatch "NNUE1SKHY 0\.3\.1") { throw "Unexpected engine version in source payload" }

      - name: Write minimal pbrain CMake project
        shell: pwsh
        run: |
          @'
          cmake_minimum_required(VERSION 3.20)
          project(NNUE1SKHY VERSION 0.3.1 LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)

          add_library(nnue1skhy_core
              src/core/position.cpp
              src/core/config.cpp
              src/rules/renju.cpp
              src/rules/renju_reference.cpp
              src/search/eval.cpp
              src/search/tt.cpp
              src/search/search.cpp
              src/search/threat_solver.cpp
              src/nnue/nnue.cpp
              src/nnue/nnue_cuda_stub.cpp
              src/hardware/hardware.cpp
          )

          if(CMAKE_SYSTEM_PROCESSOR MATCHES "x86_64|AMD64|amd64|i.86")
              target_sources(nnue1skhy_core PRIVATE src/nnue/nnue_avx2.cpp)
              target_compile_definitions(nnue1skhy_core PRIVATE NNUE1SKHY_AVX2_KERNEL=1)
              if(MSVC)
                  set_source_files_properties(src/nnue/nnue_avx2.cpp PROPERTIES COMPILE_OPTIONS "/arch:AVX2")
              endif()
          endif()

          target_include_directories(nnue1skhy_core PUBLIC src)
          if(MSVC)
              target_compile_options(nnue1skhy_core PRIVATE /O2 /W4 /permissive-)
          endif()

          add_executable(NNUE1SKHY
              src/main.cpp
              src/protocol/piskvork.cpp
          )
          target_link_libraries(NNUE1SKHY PRIVATE nnue1skhy_core)
          '@ | Set-Content -Encoding ascii "$env:PBRAIN_ROOT/CMakeLists.txt"

      - name: Configure MSVC x64
        shell: pwsh
        run: cmake -S "$env:PBRAIN_ROOT" -B build -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --target NNUE1SKHY --parallel 2

      - name: Piskvork protocol smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build/Release/NNUE1SKHY.exe").Path
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true
          $p = New-Object System.Diagnostics.Process
          $p.StartInfo = $psi
          if (!$p.Start()) { throw "Failed to start engine" }
          $p.StandardInput.WriteLine("START 15")
          $p.StandardInput.WriteLine("ABOUT")
          $p.StandardInput.WriteLine("END")
          $p.StandardInput.Close()
          if (!$p.WaitForExit(15000)) {
            $p.Kill()
            throw "Engine protocol smoke test timed out"
          }
          $stdout = $p.StandardOutput.ReadToEnd()
          $stderr = $p.StandardError.ReadToEnd()
          Write-Host "STDOUT:"
          Write-Host $stdout
          if ($stderr) {
            Write-Host "STDERR:"
            Write-Host $stderr
          }
          $lines = $stdout -split "[\r\n]+" | Where-Object { $_ -ne "" }
          if ($lines.Count -lt 2) { throw "Too few protocol responses" }
          if ($lines[0].Trim() -ne "OK") { throw "START 15 did not return OK. Got: $($lines[0])" }
          if ($stdout -notmatch "name=") { throw "ABOUT response missing name field" }
          if ($p.ExitCode -ne 0) { throw "Engine exited with code $($p.ExitCode)" }

      - name: Package pbrain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/config | Out-Null
          Copy-Item build/Release/NNUE1SKHY.exe dist/pbrain-NNUE1SKHY_renju-15.exe
          Copy-Item "$env:PBRAIN_ROOT/config/NNUE1SKHY.toml" dist/config/NNUE1SKHY.toml
          @'
          NNUE1SKHY v0.3.1 Win64 pbrain
          Renju 15x15 only.
          Register pbrain-NNUE1SKHY_renju-15.exe in Piskvork/Pixvork.
          The engine searches config/NNUE1SKHY.toml relative to the EXE directory.
          No trained NNUE network is bundled in this artifact; if the configured network is absent,
          the engine uses its CPU/classical fallback.
          '@ | Set-Content -Encoding utf8 dist/README-PBRAIN.txt
          Get-FileHash dist/pbrain-NNUE1SKHY_renju-15.exe -Algorithm SHA256 |
            Format-List | Out-File -Encoding ascii dist/SHA256.txt

      - name: Upload Win64 pbrain artifact
        uses: actions/upload-artifact@v4
        with:
          name: NNUE1SKHY-v0.3.1-pbrain-win64
          path: dist/
          if-no-files-found: error
