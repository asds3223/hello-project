name: Build NNUE1SKHY pbrain Win64

on:
  workflow_dispatch:
  push:
    branches: [nnue1skhy-v0.3.1-pbrain]
    paths:
      - "pbrain_min_payload/**"
      - ".github/workflows/build-pbrain.yml"

jobs:
  repair-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and repair source ZIP
        shell: bash
        run: |
          cat pbrain_min_payload/source_{00..08}.b64 | tr -d '\r\n' | base64 -d > bad.zip
          mkdir -p repaired
          zip -FF bad.zip --out repaired.zip || true
          unzip -o repaired.zip -d repaired
          test -f repaired/pbrain_min/src/main.cpp
          echo "source repair OK"
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-pbrain-source
          path: repaired/
          if-no-files-found: error

  build:
    needs: repair-source
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: repaired-pbrain-source
          path: srcpkg

      - name: Locate source
        shell: pwsh
        run: |
          $mf = Get-ChildItem "$pwd\srcpkg" -Recurse -File -Filter main.cpp | Select-Object -First 1
          if (-not $mf) { throw "main.cpp missing" }
          $root = Split-Path (Split-Path $mf.FullName -Parent) -Parent
          "PBRAIN_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PBRAIN_ROOT=$root"

      - name: Write minimal CMake
        shell: pwsh
        run: |
          @'
          cmake_minimum_required(VERSION 3.20)
          project(NNUE1SKHY VERSION 0.3.1 LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          add_library(nnue1skhy_core
            src/core/position.cpp src/core/config.cpp
            src/rules/renju.cpp src/rules/renju_reference.cpp
            src/search/eval.cpp src/search/tt.cpp src/search/search.cpp src/search/threat_solver.cpp
            src/nnue/nnue.cpp src/nnue/nnue_cuda_stub.cpp
            src/hardware/hardware.cpp)
          if(CMAKE_SYSTEM_PROCESSOR MATCHES "x86_64|AMD64|amd64|i.86")
            target_sources(nnue1skhy_core PRIVATE src/nnue/nnue_avx2.cpp)
            target_compile_definitions(nnue1skhy_core PRIVATE NNUE1SKHY_AVX2_KERNEL=1)
            if(MSVC)
              set_source_files_properties(src/nnue/nnue_avx2.cpp PROPERTIES COMPILE_OPTIONS "/arch:AVX2")
            endif()
          endif()
          target_include_directories(nnue1skhy_core PUBLIC src)
          if(MSVC)
            target_compile_options(nnue1skhy_core PRIVATE /O2 /W4 /permissive-)
          endif()
          add_executable(NNUE1SKHY src/main.cpp src/protocol/piskvork.cpp)
          target_link_libraries(NNUE1SKHY PRIVATE nnue1skhy_core)
          '@ | Set-Content -Encoding ascii "$env:PBRAIN_ROOT\CMakeLists.txt"

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S "$env:PBRAIN_ROOT" -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --target NNUE1SKHY --parallel 2

      - name: Package pbrain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/NNUE1SKHY.exe dist/pbrain-NNUE1SKHY_renju-15.exe
          Copy-Item build/Release/NNUE1SKHY.exe dist/pbrain-NNUE1SKHY.exe
          if (Test-Path "$env:PBRAIN_ROOT\config\NNUE1SKHY.toml") {
            New-Item -ItemType Directory -Force dist/config | Out-Null
            Copy-Item "$env:PBRAIN_ROOT\config\NNUE1SKHY.toml" dist/config/NNUE1SKHY.toml
          }
          Get-FileHash dist/pbrain-NNUE1SKHY_renju-15.exe -Algorithm SHA256 |
            Format-List | Out-File -Encoding ascii dist/SHA256.txt

      - name: Protocol smoke
        shell: pwsh
        run: |
          $exe=(Resolve-Path "dist/pbrain-NNUE1SKHY_renju-15.exe").Path
          $psi=[Diagnostics.ProcessStartInfo]::new()
          $psi.FileName=$exe
          $psi.UseShellExecute=$false
          $psi.RedirectStandardInput=$true
          $psi.RedirectStandardOutput=$true
          $p=[Diagnostics.Process]::new(); $p.StartInfo=$psi; [void]$p.Start()
          $p.StandardInput.WriteLine("START 15")
          $p.StandardInput.WriteLine("ABOUT")
          $p.StandardInput.WriteLine("END")
          $p.StandardInput.Close()
          if(-not $p.WaitForExit(15000)){ $p.Kill(); throw "timeout" }
          $out=$p.StandardOutput.ReadToEnd(); Write-Host $out
          if($out -notmatch "(?m)^OK\r?$"){ throw "START 15 failed" }
          if($out -notmatch "name="){ throw "ABOUT failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: NNUE1SKHY-v0.3.1-pbrain-win64
          path: dist/
          if-no-files-found: error
